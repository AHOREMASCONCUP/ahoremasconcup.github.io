name: Unstick site publish
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Stuck deployment build version (commit sha) to cancel"
        required: true
permissions:
  pages: write
  deployments: write
  contents: read
jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck deployment and request a fresh build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
        run: |
          note(){ echo "::notice title=$1::$(echo "$2" | tr '\n' ' ' | cut -c1-600)"; }
          note "Pages status" "$(gh api repos/$REPO/pages/deployments/$SHA 2>&1)"
          note "Cancel" "$(gh api -X POST repos/$REPO/pages/deployments/$SHA/cancel 2>&1)"
          # Also mark any in-progress github-pages deployment for that commit as failed
          for id in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=20" --jq ".[] | select(.sha==\"$SHA\") | .id"); do
            note "Deployment $id" "$(gh api -X POST repos/$REPO/deployments/$id/statuses -f state=failure -f description='cancelled stuck deploy' 2>&1 | head -c 300)"
          done
          sleep 8
          note "Pages status after" "$(gh api repos/$REPO/pages/deployments/$SHA 2>&1)"
          note "Rebuild" "$(gh api -X POST repos/$REPO/pages/builds 2>&1)"
