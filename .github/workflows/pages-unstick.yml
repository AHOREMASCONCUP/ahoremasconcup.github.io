name: Unstick site publish
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Stuck deployment build version (commit sha) to cancel"
        required: true
permissions:
  pages: write
  contents: read
jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck deployment and request a fresh build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/${{ inputs.sha }}/cancel" && echo "::notice title=Cancelled::${{ inputs.sha }}" || echo "::notice title=Cancel failed::maybe already finished"
          sleep 5
          gh api -X POST "repos/${{ github.repository }}/pages/builds" && echo "::notice title=Rebuild::requested" || echo "::notice title=Rebuild request failed::"
